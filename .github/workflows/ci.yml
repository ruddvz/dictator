name: macOS build and tests

# Manual only. The project's tests are run locally with ./Scripts/test.sh; GitHub's hosted runners
# ship an older Xcode than development uses, so automatic runs reported failures that weren't real.
on:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build and test
        run: xcodebuild -project Dictator.xcodeproj -scheme Dictator -derivedDataPath build CODE_SIGNING_ALLOWED=NO test
