name: Dictator
options:
  bundleIdPrefix: com.ruddvz
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  argmax-oss-swift:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.1.1
  DictatorParakeet:
    path: Packages/DictatorParakeet
  DictatorLlama:
    path: Packages/DictatorLlama
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Dictator:
    type: application
    platform: macOS
    sources: [Dictator]
    dependencies:
      - package: argmax-oss-swift
        product: WhisperKit
      - package: DictatorParakeet
      - package: DictatorLlama
    info:
      path: Dictator/Info.plist
      properties:
        CFBundleDisplayName: Dictator
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSMotionUsageDescription: Dictator reads processed head motion from compatible headphones for local silent-mouthing experiments.
        NSMicrophoneUsageDescription: Dictator listens only when you start local dictation, meeting notes, or an experiment recording.
        NSAudioCaptureUsageDescription: Dictator captures system audio only when you explicitly start a meeting using System audio or Both sides. Audio is streamed to on-device speech recognition and is not saved.
        NSSpeechRecognitionUsageDescription: Dictator recognizes speech on this Mac only when on-device recognition is available.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruddvz.dictator
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DictatorTests:
    type: bundle.unit-test
    platform: macOS
    sources: [DictatorTests]
    dependencies:
      - target: Dictator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruddvz.dictator.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Dictator:
    build:
      targets:
        Dictator: all
        DictatorTests: [test]
    test:
      targets:
        - DictatorTests
