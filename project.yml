name: HushKey
options:
  bundleIdPrefix: com.ruddvz
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  argmax-oss-swift:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.1.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HushKey:
    type: application
    platform: macOS
    sources: [HushKey]
    dependencies:
      - package: argmax-oss-swift
        product: WhisperKit
    info:
      path: HushKey/Info.plist
      properties:
        CFBundleDisplayName: HushKey
        LSApplicationCategoryType: public.app-category.productivity
        NSMotionUsageDescription: HushKey reads processed head motion from compatible headphones for local silent-mouthing experiments.
        NSMicrophoneUsageDescription: HushKey listens only when you start local dictation, meeting notes, or an experiment recording.
        NSSpeechRecognitionUsageDescription: HushKey recognizes speech on this Mac only when on-device recognition is available.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruddvz.hushkey
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  HushKeyTests:
    type: bundle.unit-test
    platform: macOS
    sources: [HushKeyTests]
    dependencies:
      - target: HushKey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruddvz.hushkey.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HushKey:
    build:
      targets:
        HushKey: all
        HushKeyTests: [test]
    test:
      targets: [HushKeyTests]
